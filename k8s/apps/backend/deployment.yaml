apiVersion: apps/v1
kind: Deployment
metadata:
  name: hirebean-backend
  namespace: hirebean
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hirebean-backend
  template:
    metadata:
      labels:
        app: hirebean-backend
    spec:
      containers:
        - name: hirebean-backend
          image: uchihadari/hirebean-backend:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/hirebean_db
            - name: HIREBEAN_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hirebean-db-secret
                  key: HIREBEAN_DB_USERNAME
            - name: HIREBEAN_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: hirebean-db-secret
                  key: HIREBEAN_DB_PASS
            - name: APP_FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: hirebean-db-secret
                  key: APP_FRONTEND_URL
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: MAIL_PASSWORD

            - name: CDN_URL
              valueFrom:
                secretKeyRef:
                  name: hirebean-db-secret
                  key: CDN_URL

            - name: AWS_S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: hirebean-db-secret
                  key: AWS_S3_BUCKET_NAME

            - name: SPRING_CLOUD_AWS_REGION_STATIC
              value: "eu-north-1"

            - name: SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_ACCESS_KEY_ID

            - name: SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_SECRET_ACCESS_KEY

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          ports:
            - containerPort: 8080

