spring:
  application:
    name: hirebean

  # Setting for uploading files
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${HIREBEAN_DB_USERNAME}
    password: ${HIREBEAN_DB_PASS}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always


storage:
  supabase-url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SECRET_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
  public-bucket: ${SUPABASE_PUBLIC_BUCKET:hirebean-public}
  private-bucket: ${SUPABASE_PRIVATE_BUCKET:hirebean-private}
  signed-url-seconds: ${SUPABASE_SIGNED_URL_SECONDS:600}

app:
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  demo-data:
    enabled: ${APP_SEED_DEMO_DATA:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000 # 1 hour in milliseconds
