spring:
  datasource:
    url: jdbc:h2:mem:hirebean_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@gmail.com
    password: test
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

storage:
  supabase-url: http://localhost:54321
  service-key: test-service-key
  public-bucket: hirebean-public
  private-bucket: hirebean-private
  signed-url-seconds: 600

app:
  backend-url: http://localhost:8080
  frontend-url: http://localhost:3000
  jwt:
    secret: test-secret-key-minimum-32-characters-long!!
    expiration: 86400000
